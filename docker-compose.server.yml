services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tess-app
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://tess:${MYSQL_PASSWORD}@mysql:3306/tess_db
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  mysql:
    image: mysql:8.4
    container_name: tess-mysql-prod
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: tess_db
      MYSQL_USER: tess
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_prod_data:
